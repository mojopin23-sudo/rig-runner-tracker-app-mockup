<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<link rel="icon" href="data:,"><title>Rig Runner Tracker – Field App Mockup</title>
<style>
:root{--red:#F3011B;--ink:#2A2A27;--red-dark:#c20016;--grey:#6b6b66;--line:#e2e2de;--bg:#f4f4f2}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#d9d9d4;font-size:14px;display:flex;justify-content:center;align-items:center;min-height:100vh}
a{color:var(--red-dark)}button{font-family:inherit}
.phone{width:414px;height:868px;border:12px solid #151514;border-radius:52px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.28);position:relative}
@media(max-width:500px){body{display:block;background:var(--bg)}.phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}}
.ptop{flex:none;background:#fff;border-bottom:4px solid var(--red);display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;cursor:pointer}
.brand img{height:30px}.brand .divider{width:1px;height:24px;background:#d6d6d2}.brand .appname{font-size:18px;font-weight:700}
.spacer{flex:1}
.pback{width:34px;height:34px;border-radius:8px;border:1px solid #cfcfca;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer}
.ptitle{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.demo{background:#fff4d6;color:#7a5600;text-align:center;font-size:11px;font-weight:700;padding:3px}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 22px;display:flex;flex-direction:column;gap:12px}
.ph-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--grey);margin:6px 2px -4px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tip{background:#eef4fc;border:1px solid #c6d8f0;color:#1b3f73;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.4}
.note{background:#fff8e1;border:1px solid #f1d27a;color:#6b4d00;border-radius:10px;padding:9px 11px;font-size:13px}
.ok{background:#e9f7ee;border:1px solid #a9dbbb;color:#155d33;border-radius:10px;padding:9px 11px;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #cfcfca;background:#fff;color:var(--ink);padding:10px 14px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.green{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.bigbtn{display:flex;width:100%;padding:15px;font-size:17px;border-radius:10px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);display:flex;flex-direction:column;gap:8px;min-height:128px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);text-align:left;font:inherit}
.tile .ico{width:42px;height:42px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.tile.red .ico{background:var(--red)}
.tile .nm{font-size:16px;font-weight:700}.tile .ds{font-size:12px;color:var(--grey);line-height:1.3}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%}
.li .t{font-weight:700;font-size:15px}.li .s{font-size:12.5px;color:var(--grey);margin-top:2px}.li .chev{margin-left:auto;color:var(--grey);font-size:20px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:#ececea;color:#55554f}
.pill.g{background:#e0f4e7;color:#16713d}.pill.b{background:#e3eefc;color:#1b4f9c}.pill.r{background:#fde4e2;color:#a3221a}
.gps{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#16713d;background:#e0f4e7;border-radius:999px;padding:3px 9px}
.gps i{width:7px;height:7px;border-radius:50%;background:#1f8a4c;display:inline-block}
.clock{text-align:center;padding:18px 14px}
.clock .st{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#16713d}
.clock .st.off{color:var(--grey)}
.clock .big{font-size:46px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.clock .since{color:var(--grey);font-size:13.5px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:13px;font-weight:700}
.fld .h{font-size:12px;color:var(--grey)}
.req{color:var(--red)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=tel],input[type=email],select,textarea{width:100%;font-size:15px;padding:10px;border:1px solid #cfcfca;border-radius:8px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:70px}
.auto{font-size:10.5px;font-weight:700;color:#1b4f9c;background:#e3eefc;border-radius:999px;padding:1px 7px;margin-left:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}.chk input{width:18px;height:18px;accent-color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}.kv:last-child{border:0}.kv b{text-align:right}
.map{position:relative;height:170px;border-radius:10px;overflow:hidden;border:1px solid #cfcfca;cursor:crosshair;
background:linear-gradient(90deg,transparent 48%,#e8d9a8 48%,#e8d9a8 52%,transparent 52%),linear-gradient(0deg,transparent 60%,#ddd 60%,#ddd 63%,transparent 63%),linear-gradient(135deg,#dfe9cf,#cfe0b8)}
.map .pin{position:absolute;width:24px;height:24px;margin:-24px 0 0 -12px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.map .lbl{position:absolute;left:8px;bottom:6px;background:rgba(255,255,255,.9);font-size:11.5px;padding:3px 7px;border-radius:6px;font-weight:700}
.sig{width:100%;height:110px;background:#fff;border:1px dashed #b9b9b3;border-radius:8px;touch-action:none;display:block}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:1px solid #cfcfca;background:#fff;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:13px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.ci:last-child{border:0}.ci .n{flex:1;font-size:14px}
.pd button{border:1px solid #cfcfca;background:#fff;border-radius:7px;padding:6px 10px;font-weight:700;cursor:pointer}
.pd button.p.on{background:#1f8a4c;color:#fff;border-color:#1f8a4c}.pd button.d.on{background:var(--red);color:#fff;border-color:var(--red)}
.done{text-align:center;padding:30px 10px}.done .chkc{width:72px;height:72px;border-radius:50%;background:#1f8a4c;color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:10px auto}
.done h2{margin:8px 0}
.load{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}.load span{flex:1}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:9}
.sheet{background:#fff;width:100%;max-height:75%;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.hidden{display:none!important}
</style></head><body>

/* ---- Time Clock (from the time keeping mockup) ---- */
let TICK=null;
function fmtEl(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
R.tc=()=>{hdr('Time Clock');const c=S.clock;
setTimeout(()=>{clearInterval(TICK);if(S.clock)TICK=setInterval(()=>{const b=$('el');if(b)b.textContent=fmtEl(Date.now()-S.clock.t)},1000)},0);
return '<div class="card clock"><div class="st'+(c?'':' off')+'">'+(c?'On the clock':'Off the clock')+'</div><div class="big" id="el">'+(c?fmtEl(Date.now()-c.t):'00:00:00')+'</div><div class="since">'+(c?'Since '+c.at+' · Job #'+c.job:'Not clocked in')+'</div></div>'+
(c?'':fld('Job',sel('tcjob',JOBS.map(j=>'#'+j.id+' · '+j.title)),1))+
'<div class="card"><label class="chk"><input type="checkbox" id="eqt" '+(S.eq.t?'checked':'')+' onchange="S.eq.t=this.checked"'+(c?' disabled':'')+'><b>Clock into your linked equipment</b></label><div class="ci" style="margin-top:6px"><span class="n">'+EQUIP.trucks[0]+'<div style="font-size:12px;color:var(--grey)">Your linked unit</div></span><span class="pill '+(c&&c.eq?'g':'')+'">'+(c&&c.eq?'Clocked in':'Idle')+'</span></div></div>'+
(c?'<button class="btn primary bigbtn" id="tcbtn" onclick="clockOut()">Clock Out</button>':'<button class="btn green bigbtn" id="tcbtn" onclick="clockIn()">Clock In</button>')+
(S.lastShift?'<div class="ok">Last shift: '+S.lastShift+'</div>':'');};
function clockIn(){const v=$('tcjob').value.match(/#(\d+)/)[1],j=job(v);S.clock={t:Date.now(),at:now(),job:v,eq:S.eq.t};render()}
function clockOut(){const c=S.clock,j=job(c.job);S.lastShift=c.at+' – '+now()+(c.eq?' · '+EQUIP.trucks[0].split(' ')[0]+' clocked out with you':'');S.clock=null;clearInterval(TICK);render()}
