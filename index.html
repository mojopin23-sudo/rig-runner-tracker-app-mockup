<!DOCTYPE html>
<html lang="en"><head><script src="seed.js?v=21"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" href="data:,"><title>Rig Runner Tracker – Field App Mockup</title>
<style>
:root{--red:#F3011B;--ink:#2A2A27;--red-dark:#c20016;--grey:#6b6b66;--line:#e2e2de;--bg:#f4f4f2}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#d9d9d4;font-size:14px;display:flex;justify-content:center;align-items:center;min-height:100vh}
a{color:var(--red-dark)}button{font-family:inherit}
.phone{width:414px;height:868px;border:12px solid #151514;border-radius:52px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.28);position:relative}
@media(max-width:500px){body{display:block;background:var(--bg)}.phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}}
.ptop{flex:none;background:#fff;border-bottom:4px solid var(--red);display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;cursor:pointer}
.brand img{height:30px}.brand .divider{width:1px;height:24px;background:#d6d6d2}.brand .appname{font-size:18px;font-weight:700}
.spacer{flex:1}
.pback{width:34px;height:34px;border-radius:8px;border:1px solid #cfcfca;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer}
.ptitle{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.demo{background:#fff4d6;color:#7a5600;text-align:center;font-size:11px;font-weight:700;padding:3px}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 22px;display:flex;flex-direction:column;gap:12px}
.ph-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--grey);margin:6px 2px -4px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tip{background:#eef4fc;border:1px solid #c6d8f0;color:#1b3f73;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.4}
.note{background:#fff8e1;border:1px solid #f1d27a;color:#6b4d00;border-radius:10px;padding:9px 11px;font-size:13px}
.ok{background:#e9f7ee;border:1px solid #a9dbbb;color:#155d33;border-radius:10px;padding:9px 11px;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #cfcfca;background:#fff;color:var(--ink);padding:10px 14px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.green{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.bigbtn{display:flex;width:100%;padding:15px;font-size:17px;border-radius:10px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);display:flex;flex-direction:column;gap:8px;min-height:128px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);text-align:left;font:inherit}
.tile .ico{width:42px;height:42px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.tile.red .ico{background:var(--red)}
.tile .nm{font-size:16px;font-weight:700}.tile .ds{font-size:12px;color:var(--grey);line-height:1.3}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%}
.li .t{font-weight:700;font-size:15px}.li .s{font-size:12.5px;color:var(--grey);margin-top:2px}.li .chev{margin-left:auto;color:var(--grey);font-size:20px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:#ececea;color:#55554f}
.pill.g{background:#e0f4e7;color:#16713d}.pill.b{background:#e3eefc;color:#1b4f9c}.pill.r{background:#fde4e2;color:#a3221a}
.gps{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#16713d;background:#e0f4e7;border-radius:999px;padding:3px 9px}
.gps i{width:7px;height:7px;border-radius:50%;background:#1f8a4c;display:inline-block}
.clock{text-align:center;padding:18px 14px}
.clock .st{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#16713d}
.clock .st.off{color:var(--grey)}
.clock .big{font-size:46px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.clock .since{color:var(--grey);font-size:13.5px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:13px;font-weight:700}
.fld .h{font-size:12px;color:var(--grey)}
.req{color:var(--red)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=tel],input[type=email],select,textarea{width:100%;font-size:15px;padding:10px;border:1px solid #cfcfca;border-radius:8px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:70px}
.auto{font-size:10.5px;font-weight:700;color:#1b4f9c;background:#e3eefc;border-radius:999px;padding:1px 7px;margin-left:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}.chk input{width:18px;height:18px;accent-color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}.kv:last-child{border:0}.kv b{text-align:right}
.map{position:relative;height:170px;border-radius:10px;overflow:hidden;border:1px solid #cfcfca;cursor:crosshair;
background:linear-gradient(90deg,transparent 48%,#e8d9a8 48%,#e8d9a8 52%,transparent 52%),linear-gradient(0deg,transparent 60%,#ddd 60%,#ddd 63%,transparent 63%),linear-gradient(135deg,#dfe9cf,#cfe0b8)}
.map .pin{position:absolute;width:24px;height:24px;margin:-24px 0 0 -12px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.map .lbl{position:absolute;left:8px;bottom:6px;background:rgba(255,255,255,.9);font-size:11.5px;padding:3px 7px;border-radius:6px;font-weight:700}
.sig{width:100%;height:110px;background:#fff;border:1px dashed #b9b9b3;border-radius:8px;touch-action:none;display:block}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:1px solid #cfcfca;background:#fff;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:13px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.ci:last-child{border:0}.ci .n{flex:1;font-size:14px}
.sat{border:1px solid #1f8a4c;background:#e0f4e7;color:#16713d;border-radius:7px;padding:6px 8px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}.sat.ns{background:var(--red);border-color:var(--red);color:#fff}
.ci-wrap{border-bottom:1px solid var(--line);padding:8px 0}
.ci-wrap:last-child{border:0}
.ci-wrap .ci{border:0;padding:0}
.insp-extra{margin-top:8px}
.insp-extra textarea{min-height:72px}
.wbform-wrap{overflow:auto;-webkit-overflow-scrolling:touch;background:#e8e8e4;margin:0 -14px;padding:10px;max-height:62vh}
.wbform{background:#fff;width:8.5in;min-height:11in;margin:0 auto;padding:.3in;font-size:9.5px;box-shadow:0 2px 10px rgba(0,0,0,.15);font-family:Arial,Helvetica,sans-serif;color:#000}
.wbform .top{display:flex;gap:10px}
.wbform .lg{height:60px}
.wbform .hdr1{flex:1}
.wbform .ppe{background:#c00;color:#fff;padding:1px 6px;font-weight:700}
.wbform .hrow{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.wbform .ttl{font-size:15px;font-weight:700;text-align:center}
.wbform .ldno{color:#c00;font-size:24px;text-align:center}
.wbform .ldno small{display:block;color:#000;font-size:9px}
.wbform .addr{text-align:center}
.wbform .bx{border:1px solid #000;padding:3px 5px;margin-top:-1px}
.wbform .g2{display:grid;grid-template-columns:1fr 1fr}
.wbform .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 8px}
.wbform .g73{display:grid;grid-template-columns:1fr 130px}
.wbform .redbar{background:#c00;color:#fff;font-weight:700;text-align:center;margin:-3px -5px 3px}
.wbform .red{border:1px solid #c00}
.wbform .fine{font-size:7px}
.wbform .v{font-family:"Comic Sans MS",cursive;color:#1b2a6b;font-size:10.5px;border-bottom:1px solid #999;min-width:30px;display:inline-block}
.wbform table.lines{border-collapse:collapse;width:100%}
.wbform table.lines th,.wbform table.lines td{border:1px solid #000;height:17px;padding:1px 3px;font-size:9px}
.wbform table.lines td{font-family:"Comic Sans MS",cursive;color:#1b2a6b}
.wbform table.lines .rh{color:#c00}
.wbform .osow{color:#c00;font-weight:700;text-align:center;font-family:Arial,Helvetica,sans-serif!important}
.wbform table.chg{border-collapse:collapse;width:100%}
.wbform table.chg td{border:1px solid #000;height:28px;padding:2px;text-align:center}
.wbform .sg{margin:3px 0 6px}
.wbform .sgi{display:inline-block;width:180px;height:34px;border-bottom:1px solid #000;vertical-align:bottom}
.wbform .orig{text-align:center;color:#c00;font-weight:700;font-size:13px;margin-top:4px}
.pd button{border:1px solid #cfcfca;background:#fff;border-radius:7px;padding:6px 10px;font-weight:700;cursor:pointer}
.pd button.p.on{background:#1f8a4c;color:#fff;border-color:#1f8a4c}.pd button.d.on{background:var(--red);color:#fff;border-color:var(--red)}
.done{text-align:center;padding:30px 10px}.done .chkc{width:72px;height:72px;border-radius:50%;background:#1f8a4c;color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:10px auto}
.done h2{margin:8px 0}
.load{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}.load span{flex:1}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:9}
.sheet{background:#fff;width:100%;max-height:75%;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.hidden{display:none!important}
</style></head><body>

function wbSnapshot(kind,jid){const d={no:String(S.loadNo),status:'In Progress',kind:kind==='std'?'Standalone':kind==='log'?'Log-Only':'Rig Move'};if(kind==='rig'||(kind!=='std'&&kind!=='log'&&$('wdate'))){const j=job(jid);d.date=$('wdate')?$('wdate').value:j.date;d.driver=$('wdrv')?$('wdrv').value:ME.name;d.truck=$('wtruck')?$('wtruck').value:'';d.trailer=$('wtrl')?$('wtrl').value:'';d.old=$('wold')?$('wold').value:j.old;d.new=$('wnew')?$('wnew').value:j.new;d.orig=$('worig')?$('worig').value:'';d.dest=$('wdest')?$('wdest').value:'';d.route=$('wroute')?$('wroute').value:'';d.loads=(S.loads||[]).slice();d.loadCount=String((S.loads||[]).length);d.job='#'+j.id+' · '+j.rig;d.customer=CUSTS[j.cust].n}else if(kind==='std'||$('sd')){d.date=$('sd')?$('sd').value:today();d.customer=$('scust')?$('scust').value:'';d.shipper=$('shn')?$('shn').value:'';d.desc=$('sdesc')?$('sdesc').value:'';d.truck=$('st')?$('st').value:'';d.trailer=$('str')?$('str').value:'';d.driver=ME.name}else if(kind==='log'||$('lj')){d.job=$('lj')?$('lj').value:'';d.role=($('role')&&$('role').dataset.v)||'Swamper';d.start=$('ls')?$('ls').value:'';d.end=$('le')?$('le').value:'';d.notes=$('ln')?$('ln').value:'';d.driver=ME.name}return d}
function wbPdfRows(d){const rows=[];rows.push(kv('Waybill #',d.no));rows.push(kv('Status',d.status));if(d.kind)rows.push(kv('Type',d.kind));if(d.job)rows.push(kv('Job',d.job));if(d.customer)rows.push(kv('Customer',d.customer));if(d.date)rows.push(kv('Date',wbFmtDate(d.date)));if(d.driver)rows.push(kv('Driver',d.driver));if(d.role)rows.push(kv('Role',d.role));if(d.truck)rows.push(kv('Truck',d.truck));if(d.trailer)rows.push(kv('Trailer',d.trailer));if(d.old)rows.push(kv('Old End',d.old));if(d.new)rows.push(kv('New End',d.new));if(d.orig)rows.push(kv('Origination',d.orig));if(d.dest)rows.push(kv('Destination',d.dest));if(d.route)rows.push(kv('Route Taken',d.route));if(d.shipper)rows.push(kv('Shipper',d.shipper));if(d.desc)rows.push(kv('Description',d.desc));if(d.start)rows.push(kv('Start Time',d.start));if(d.end)rows.push(kv('End Time',d.end));if(d.loadCount)rows.push(kv('Loads',d.loadCount));return rows.join('')}

function tgl(b){const ns=b.classList.toggle('ns');b.textContent=ns?'Not Satisfactory':'Satisfactory';const wrap=b.closest('.ci-wrap');const extra=wrap&&wrap.querySelector('.insp-extra');if(extra){extra.classList.toggle('hidden',!ns);if(!ns){const err=extra.querySelector('.insp-err');if(err)err.classList.add('hidden')}}}
function inspGuard(){let first=null;document.querySelectorAll('.sat.ns').forEach(b=>{const wrap=b.closest('.ci-wrap');const ta=wrap&&wrap.querySelector('.insp-note');const err=wrap&&wrap.querySelector('.insp-err');if(!ta||!ta.value.trim()){if(err)err.classList.remove('hidden');if(!first)first=ta||b}else if(err)err.classList.add('hidden')});if(!first)return true;first.scrollIntoView({block:'center'});if(first.focus)first.focus();return false}

/* ---- Field Safety Report (daily, per job) ---- */
const FSRK='rrFSR';
const FSRSEED=[{id:'FSR-214-2026-11-01',job:'214',rig:'Sample Rig 27',date:'2026-11-01',shift:'Day',rep:'Dale Pruitt',loc:'Old End (rig down)',wx:'Clear, 71°F',crew:'14',loads:'9',checks:['Pre-job safety meeting held','JSA reviewed and signed by crew','PPE in compliance','Stop Work Authority reviewed','Rigging inspected and tagged','Crane / forklift inspections complete'],inc:'None',haz:'Soft shoulder at lease road cattle guard.',ca:'Spotter posted at cattle guard for all loads.',notes:'',by:'Dale Pruitt'}];
const FSR={all(){try{let a=JSON.parse(localStorage.getItem(FSRK)||'null');if(!a){a=FSRSEED;localStorage.setItem(FSRK,JSON.stringify(a))}return a}catch(e){return []}},save(a){localStorage.setItem(FSRK,JSON.stringify(a))},byJob(id){return FSR.all().filter(r=>r.job==id).sort((a,b)=>a.date<b.date?1:-1)}};
const FSRCHK=['Pre-job safety meeting held','JSA reviewed and signed by crew','PPE in compliance','Stop Work Authority reviewed','Rigging inspected and tagged','Crane / forklift inspections complete','Permits and escorts on hand for OS/OW loads','Lease road and pad conditions checked'];
const mdyS=d=>{const[a,b,c]=String(d).split('-');return b+'/'+c+'/'+a};
R.fsr=pre=>{hdr('Field Safety Report');const jo=['Select a Job'].concat(JOBS.map(j=>'#'+j.id+' · '+j.title));const pv=pre?jo.find(o=>o.indexOf('#'+decodeURIComponent(pre)+' ')===0):'';
return '<div class="tip">Daily Safety Rig Move Report. One report per job per day; it saves to the job record. Saving again for the same job and date updates that day\'s report.</div>'+
fld('Job',sel('fj',jo,pv),1)+fld('Date',inp('fdate',today(),'date'),1,'','PREFILLED')+fld('Shift','<div class="seg" id="fshift"><button class="on">Day</button><button>Night</button></div>',1)+
fld('Field Safety Rep',inp('frep',ME.name),1,'','PREFILLED')+fld('Work Location',sel('floc',['Old End (rig down)','In Transit','New End (rig up)']),1)+
fld('Weather / Conditions',inp('fwx','Clear, 68°F, light wind'))+'<div class="row2">'+fld('Crew on Location',inp('fcrew','12','number'),1)+fld('Loads Moved Today',inp('floads','0','number'),1)+'</div>'+
'<div class="ph-h">Safety Checks</div><div class="card">'+FSRCHK.map((c,i)=>'<label class="chk ci"><input type="checkbox" class="fsrc" data-i="'+i+'">'+esc(c)+'</label>').join('')+'</div>'+
fld('Incidents Today','<div class="seg" id="finc"><button class="on">None</button><button>Near Miss</button><button>Incident</button></div>',1,'Near misses and incidents also need their own report.')+
fld('Hazards Observed',ta('fhaz','e.g. soft lease road at cattle guard, overhead line at pad entrance'))+fld('Corrective Actions',ta('fca'))+fld('Notes',ta('fnotes'))+photo('fsph')+sig('fsig','Field Safety Rep Signature')+
'<div id="fsr-err" class="note hidden" style="color:var(--red);font-weight:700">Pick a job before saving.</div>'+
'<button class="btn primary bigbtn" id="submit" onclick="fsrSave()">Save Report</button>';};
function fsrSave(){const jv=$('fj').value;if(!/^#/.test(jv)){$('fsr-err').classList.remove('hidden');$('fj').scrollIntoView();return}
const id=jv.slice(1).split(' · ')[0],j=job(id),d=$('fdate').value||today();
const r={id:'FSR-'+id+'-'+d,job:id,rig:j.rig,date:d,shift:$('fshift').dataset.v||'Day',rep:$('frep').value,loc:$('floc').value,wx:$('fwx').value,crew:$('fcrew').value,loads:$('floads').value,
checks:[...document.querySelectorAll('.fsrc')].filter(c=>c.checked).map(c=>FSRCHK[c.dataset.i]),inc:$('finc').dataset.v||'None',haz:$('fhaz').value,ca:$('fca').value,notes:$('fnotes').value,photos:S.photos.fsph||0,by:ME.name,at:new Date().toISOString()};
const a=FSR.all().filter(x=>!(x.job==r.job&&x.date==r.date&&x.shift==r.shift));a.push(r);FSR.save(a);
doneMsg('Field Safety Report saved','Saved to the record.');DONE.job=id}
function fsrJob(j){if(!isSafetyRole())return '';const a=FSR.byJob(j.id);return '<div class="ph-h">Field Safety Reports</div><div class="card">'+(a.length?a.map(r=>'<a class="li" style="text-decoration:none" onclick="go(\'fsrv/'+encodeURIComponent(r.id+'|'+r.shift)+'\')"><div><div class="t">🦺 '+mdyS(r.date)+' · '+esc(r.shift)+' Shift</div><div class="s">'+esc(r.rep)+' · '+esc(r.loc)+' · '+r.checks.length+'/'+FSRCHK.length+' checks · '+esc(r.inc)+'</div></div><span class="chev">›</span></a>').join(''):'<div class="h" style="color:var(--grey);font-size:13px">No reports yet.</div>')+'<button class="btn" style="margin-top:8px;width:100%" onclick="go(\'fsr/'+encodeURIComponent(j.id)+'\')">+ New Field Safety Report</button></div>'}
R.fsrv=k=>{k=decodeURIComponent(k);const[id,sh]=k.split('|');const r=FSR.all().find(x=>x.id===id&&x.shift===sh);hdr('Field Safety Report');if(!r)return '<div class="note">Not found.</div>';
return '<div class="tip">✓ Saved to the record for Job #'+esc(r.job)+' · '+esc(r.rig)+'</div><div class="card">'+kv('Date',mdyS(r.date))+kv('Shift',r.shift)+kv('Field Safety Rep',r.rep)+kv('Work Location',r.loc)+kv('Weather / Conditions',r.wx||'—')+kv('Crew on Location',r.crew)+kv('Loads Moved Today',r.loads)+kv('Incidents Today',r.inc)+'</div>'+
'<div class="ph-h">Safety Checks</div><div class="card">'+FSRCHK.map(c=>'<div class="kv"><span>'+esc(c)+'</span><b>'+(r.checks.indexOf(c)>=0?'<span class="pill g">Yes</span>':'<span class="pill">No</span>')+'</b></div>').join('')+'</div>'+
'<div class="ph-h">Hazards Observed</div><div class="card" style="font-size:14px">'+esc(r.haz||'—')+'</div><div class="ph-h">Corrective Actions</div><div class="card" style="font-size:14px">'+esc(r.ca||'—')+'</div><div class="ph-h">Notes</div><div class="card" style="font-size:14px">'+esc(r.notes||'—')+'</div>';};

R.rs=pre=>{pre=decodeURIComponent(pre||'');const rec=pre.indexOf('edit:')===0?RS.all().find(x=>x.id===pre.slice(5)):null;RS_EDIT=rec?rec.id:'';hdr(rec?'Edit Route Survey':'Route Survey');setTimeout(()=>{window.RSB=RS.bind($('rsroot'),rec)},0);return '<div class="tip">Pre-Move Route Risk Assessment. Attaches to the job or bid you pick; a bid survey carries over to the job when the bid is won. <a href="javascript:void 0" onclick="RSB.demo()">Fill Sample</a></div><div id="rsroot">'+RS.formHTML({links:rsLinks(),people:RS_PEOPLE,pre:rec?rec.link:pre,today:today(),rec:rec||{name:ME.name,title:ME.pos}})+'</div><button class="btn primary bigbtn" id="rssub" onclick="rsSubmit()">'+(rec?'Save Route Survey':'Submit Route Survey')+'</button>'};

let MRPH=[];
function mrPhotos(inp){[...inp.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,480/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);MRPH.push(c.toDataURL('image/jpeg',.7));mrThumbs()};im.src=r.result};r.readAsDataURL(f)})}
function mrThumbs(){$('mrth').innerHTML=MRPH.map((p,i)=>'<img src="'+p+'" style="width:84px;height:64px;object-fit:cover;border-radius:6px;margin:0 6px 6px 0">').join('')+(MRPH.length?'<div class="h">'+MRPH.length+' photo(s) attached</div>':'')}

function pmJobs(){return JOBS.map(j=>({v:'job:'+j.id,t:'Job #'+j.id+' · '+j.rig+' · '+j.title.split('– ')[1]}))}

'<button class="btn primary bigbtn" onclick="mrSubmit()">Submit Request</button><div class="ph-h">My Requests</div><div class="card">'+(MR.all().filter(m=>m.by===ME.name).map(m=>li(m.id+' · '+esc(m.type),m.unit+' · '+m.status+(m.photos.length?' · 📷'+m.photos.length:''),'mrv/'+m.id)).join('')||'<div class="h">None yet.</div>')+'</div>'};
